<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Lifelist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="my-lifelist.css"> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Cabin:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="read-only"> 
    <header>
    <div class="hamburger-menu" id="menu-toggle">☰</div>
    <a href="dashboard.html" class="logo-link">
        <img src="lifelistlogo.png" alt="The Lifelist Logo" class="logo-img">
    </a>
    <div class="header-right">
        <div class="profile-pic-thumb" id="header-profile-pic" onclick="window.location.href='profile.html'"></div>
    </div>
</header>

<nav class="sidenav" id="sidenav-menu">
    <ul>
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="my-lifelist.html">My Lifelist</a></li>
        <li><a href="community.html">Community</a></li>
        <li><a href="profile.html">Edit Profile</a></li>
        <li id="logout-link"><a href="#">Logout</a></li>
    </ul>
</nav>

<div class="overlay" id="overlay"></div>

    <main class="lifelist-container">
        <div class="profile-sidebar">
            <h2 class="username-title" id="username-title">LOADING...</h2>
            <div class="profile-image-large" id="profile-image"></div>
            <h3 class="profile-name" id="profile-name">Loading...</h3>
            <button class="btn btn-secondary small-btn">Edit Profile</button>
        </div>

        <div class="goals-main">
            <div id="personal-goal-list" class="personal-goal-list">
                </div>
            <div class="my-lifelist-actions">
                <div class="input-wrapper">
                    <input type="text" placeholder="Type Lifelist">
                    <span class="edit-icon">✎</span>
                </div>
                <button class="btn btn-dark small-btn">Add</button>
                <button class="btn btn-secondary small-btn">Edit</button>
                <button class="btn btn-secondary small-btn">Remove</button>
            </div>
            <div class="share-story-wrapper">
                <button class="btn btn-dark share-story-btn">Share Your Story</button>
                <span class="edit-icon">✎</span>
            </div>
        </div>
    </main>
    <script src="nav.js"></script> 
    <script src="view-profile.js"></script>
</body>
</html>
