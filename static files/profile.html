<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css"> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Cabin:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
    <div class="hamburger-menu" id="menu-toggle">☰</div>
    <a href="dashboard.html" class="logo-link">
        <img src="lifelistlogo.png" alt="The Lifelist Logo" class="logo-img">
    </a>
    <div class="header-right">
        <div class="profile-pic-thumb" id="header-profile-pic" onclick="window.location.href='profile.html'"></div>
    </div>
</header>

<nav class="sidenav" id="sidenav-menu">
    <ul>
        <li><a href="dashboard.html">Home</a></li>

        <li><a href="profile.html">Edit Profile</a></li>
        <li id="logout-link"><a href="#">Logout</a></li>
    </ul>
</nav>

<div class="overlay" id="overlay"></div>

    <main class="profile-container">
        <h2 class="handwritten-text">hey USERNAME ,</h2> <div class="profile-editor">
            <div class="profile-image-editor" style="background-image: url('https://via.placeholder.com/150/FF6347/FFFFFF?text=P');">
                <label for="profile-pic-upload" class="camera-overlay">
                    <span class="camera-icon-large">📷</span>
                    <input type="file" id="profile-pic-upload" accept="image/*" class="hidden-file-input">
                </label>
            </div>
            
            <button class="btn btn-secondary profile-edit-btn" id="edit-profile-pic-btn">Edit profile picture</button>
            <button class="btn btn-secondary profile-edit-btn" id="edit-name-btn">Edit Your Name</button>
            <button class="btn btn-secondary profile-edit-btn" id="edit-username-btn">Edit user Name</button>
        </div>
        
        <div class="nav-arrow right-align" onclick="window.location.href='dashboard.html'">&#8594;</div>
    </main>
    <script src="nav.js"></script> 
    <script src="profile.js"></script>
