<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Journey</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="journey.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Quattrocento+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="demo.html" class="back-arrow">←</a>
        <a href="demo.html" class="logo-link"><img src="lifelistlogo.png" alt="The Lifelist Logo" class="logo-img"></a>
    </header>

    <main class="journey-container">
        <h2>Share Your Journey</h2>
        <div class="journey-editor">
            <textarea id="story-input" placeholder="share your story here"></textarea>
            
            <div class="journey-meta">
                <input type="text" id="title-input" placeholder="Add Title">
                
                <div class="image-uploader" id="image-uploader-box">
                    <img id="image-preview" src="" alt="Image preview" class="hidden">
                    <div id="image-placeholder">
                        <span class="camera-icon">📷</span>
                        <input type="file" id="image-input" accept="image/jpeg, image/png">
                    </div>
                </div>

                <a href="#" id="save-journey-btn" class="save-arrow">→</a>
            </div>
        </div>
    </main>

    <script src="journey.js"></script>
</body>
</html>
